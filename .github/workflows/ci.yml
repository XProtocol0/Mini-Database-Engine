name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        preset: [debug, tsan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Use clang (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # Recent Linux kernels randomize mmap with more entropy than TSan's
      # shadow-memory layout tolerates, which makes TSan binaries crash at
      # startup. Lowering it is the standard workaround on CI runners.
      - name: Relax ASLR for TSan (Linux)
        if: runner.os == 'Linux' && matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned: clang-format output changes between major versions, so CI and
      # local runs must use the same one (pip install clang-format==23.1.3).
      - name: Install clang-format
        run: pipx install clang-format==23.1.3
      - name: Check formatting
        run: |
          find include src tests benchmarks \( -name '*.h' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror
